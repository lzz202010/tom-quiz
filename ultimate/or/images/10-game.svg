c2410c" stroke="#ffffff" stroke-width="1.8"/><text x="336.0" y="192.0" font-size="14.5" fill="#c2410c" text-anchor="start" font-weight="700">p* = 0.6，V = 1</text><text x="479.6" y="80.7" font-size="13.5" fill="#0f6e7a" text-anchor="end" font-weight="400">对方出 β₁：5p − 2</text><text x="84.4" y="52.0" font-size="13.5" fill="#0f6e7a" text-anchor="start" font-weight="400">对方出 β₂：4 − 5p</text><text x="40.0" y="420.0" font-size="13" fill="#1f2a30" text-anchor="start" font-weight="400">对方总会选让我方收益更低的那条线，所以我方只能得到</text><text x="40.0" y="438.0" font-size="13" fill="#1f2a30" text-anchor="start" font-weight="400">下包络（橙线）。最优策略取下包络的最高点。</text></svg>