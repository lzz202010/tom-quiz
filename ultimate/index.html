<!-- BEGIN 返回键统一控制 (back-button.js) -->
<script>
/*!
 * 返回键统一显隐控制 —— back-button.js
 *
 * 目的：把「所有返回按钮」的显示/隐藏收敛到同一个状态机、同一套触发条件。
 *   · 页面顶部 / 刚切换页面：一律可见（永不出现「一进页面就没有返回键」）。
 *   · 持续向下浏览（累计 >= 96px 且离顶 >= 140px）：统一隐藏，避免遮挡内容。
 *   · 只要用户向上滑动（页面往顶部方向滚 / 手指快速上滑 / 方向反转）：
 *     隐藏态立即变为可见，且所有返回键同时恢复。
 *   · 状态切换后有 400ms 锁定 + 距离迟滞，惯性滚动、回弹、方向反复切换都不会抖动。
 *   · 所有 [data-back] 元素共用同一个 state，DOM 重绘 / 路由切换后新按钮自动继承，
 *     不会出现「一个显示一个隐藏」的错乱。
 *
 * 用法：每个页面引一次即可，无需改动业务 JS。本仓库由
 *   00_整理记录/同步返回键控制.py 把本文件内联进各页面（单文件可离线打开）。
 *   注意：源码里不要出现字面量「/script」结束标签，否则内联时脚本会被 HTML 解析器截断。
 * 需要纳入统一控制的按钮加 class="back" 或 data-back；控制器也会自动识别
 * .wr-back / .aiback / .vb-back / .wback 等既有返回键类名。
 */
(function (root) {
  'use strict';

  var DEFAULTS = {
    topEps: 24,      // 距顶部 <= 24px：强制显示
    minY: 140,      // 滚动位置超过它才允许隐藏
    hideAfter: 96,   // 连续下滑累计距离达到它才隐藏
    showDelta: 4,    // 上滑累计 4px 即显示（隐藏态下第一条上滑就生效）
    lockMs: 400,     // 状态切换后的锁定期，抑制惯性/回弹抖动
    flickPx: 18,     // 手指快速上滑的位移阈值
    flickMs: 260     // 手指快速上滑的时间阈值
  };

  /* ── 纯状态机：不碰 DOM，方便单独测试 ──
     delta > 0 = 页面往下滚（离顶部更远）；delta < 0 = 往顶部方向滚（上滑） */
  function Machine(cfg) {
    this.cfg = cfg || DEFAULTS;
    this.state = 'shown';
    this.changedAt = -Infinity;
    this.down = 0;
    this.up = 0;
  }
  Machine.prototype.reset = function (now) {
    this.state = 'shown'; this.changedAt = now || 0; this.down = 0; this.up = 0;
    return this.state;
  };
  Machine.prototype.show = function (now) {
    if (this.state !== 'shown') { this.state = 'shown'; this.changedAt = now || 0; }
    this.down = 0; this.up = 0;
    return this.state;
  };
  Machine.prototype.feed = function (delta, y, now, gesture) {
    var c = this.cfg;
    now = now || 0;
    if (y <= c.topEps) return this.show(now);                 // 顶部永远可见
    if (gesture === 'up') return this.show(now);               // 明确的上滑手势（wheel / 手指快滑）
    if (delta < 0) {                                          // 往顶部方向滚 → 隐藏态立刻恢复
      this.down = 0; this.up += -delta;
      if (this.state === 'hidden' || this.up >= c.showDelta) return this.show(now);
      return this.state;
    }
    if (delta > 0) {
      this.up = 0; this.down += delta;
      if (this.state === 'shown' && y >= c.minY &&
          this.down >= c.hideAfter && now - this.changedAt >= c.lockMs) {
        this.state = 'hidden'; this.changedAt = now; this.down = 0;
      }
      return this.state;
    }
    return this.state;
  };

  /* ── DOM 接线 ── */
  var CSS = [
    '[data-back]{transition:opacity .2s ease,transform .2s ease}',
    '[data-back].bb-hidden{opacity:0!important;pointer-events:none!important;transform:translateY(-6px)}',
    '.back-float{position:fixed;left:14px;top:calc(var(--bb-top,68px) + env(safe-area-inset-top,0px));z-index:55;',
    '  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;',
    '  font:inherit;font-size:13px;line-height:1.4;cursor:pointer;',
    '  color:var(--ink,#222);background:var(--card,#fff);',
    '  border:1px solid var(--line2,var(--line,#ddd));',
    '  box-shadow:0 4px 16px rgba(0,0,0,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}',
    '.back-float:hover{color:var(--acc,var(--pink,#c4513c))}',
    '.back-float:active{transform:scale(.96)}',
    '.back-float>span:first-child{font-size:16px;line-height:1}',
    '@media (prefers-reduced-motion:reduce){[data-back]{transition:none}}'
  ].join('\n');

  // 这些类名都是各站已经在用的「返回键」，统一收编
  var BACK_SELECTOR = [
    'a.back', '.back', '.wr-back', '.aiback', '.or-bar .back',
    '.vb-back', '.vb-back-2', '.wback', '.crumb a:first-child',
    '.back-float', '[data-back]'
  ].join(',');

  function now() { return Date.now(); }

  // 页面（经典版）有全局 error 处理器，任何未捕获异常都会把正文替换成报错页；
  // 因此这里所有事件回调都兜住异常，宁可不动返回键，也不能拖垮整页。
  function safe(fn) {
    return function () {
      try { return fn.apply(this, arguments); }
      catch (e) { if (typeof console !== 'undefined' && console.warn) console.warn('[back-button]', e); }
    };
  }

  function isHome() {
    var h = location.hash || '';
    return h === '' || h === '#' || h === '#/' || h === '#/home';
  }

  function backTarget() {
    var inline = document.querySelector('a.back[href],.wr-back[href],.vb-back[href],.wback[href],.aiback[href]');
    if (inline) {
      var h = inline.getAttribute('href');
      if (h && h.charAt(0) === '#') return h;
    }
    var crumbs = document.querySelectorAll('.crumb a[href]');
    if (crumbs.length > 1) return crumbs[crumbs.length - 1].getAttribute('href');
    return '#/';
  }

  function start() {
    if (root.__backBtnStarted) return root.__backBtnStarted;
    if (typeof document === 'undefined' || !document.body) return null;
    root.__backBtnStarted = true;

    var style = document.createElement('style');
    style.id = 'bb-style';
    style.textContent = CSS;
    (document.head || document.body).appendChild(style);

    var m = new Machine(DEFAULTS);
    var positions = new WeakMap();
    var pending = null, timer = 0, syncing = false, syncTimer = 0;

    function mark() {
      var list = document.querySelectorAll(BACK_SELECTOR), i;
      for (i = 0; i < list.length; i++) {
        if (!list[i].hasAttribute('data-back')) list[i].setAttribute('data-back', '');
      }
    }

    function apply(state) {
      mark();
      var list = document.querySelectorAll('[data-back]'), i, el;
      for (i = 0; i < list.length; i++) {
        el = list[i];
        // 只切同一个 class：所有返回键在同一帧拿到完全相同的状态，不存各自的状态位
        el.classList.toggle('bb-hidden', state === 'hidden');
        el.setAttribute('aria-hidden', state === 'hidden' ? 'true' : 'false');
      }
    }

    function measure() {
      var bars = document.querySelectorAll('.topbar,.top,.channelbar'), h = 0, i;
      for (i = 0; i < bars.length; i++) h += bars[i].getBoundingClientRect().height || 0;
      document.documentElement.style.setProperty('--bb-top', Math.round(h + 8) + 'px');
    }

    function goBack(btn) {
      var t = btn.getAttribute('data-target') || '#/';
      if (t === (location.hash || '#/')) {
        if (history.length > 1) history.back(); else location.hash = '#/';
      } else {
        location.hash = t;
      }
      try { window.scrollTo(0, 0); } catch (e) {}
    }

    function syncFloat() {
      var f = document.querySelector('.back-float');
      if (isHome()) { if (f) f.remove(); return; }
      if (!f) {
        f = document.createElement('button');
        f.type = 'button';
        f.className = 'back-float';
        f.setAttribute('data-back', '');
        f.setAttribute('aria-label', '返回上一页');
        f.innerHTML = '<span aria-hidden="true">←</span><span>返回</span>';
        f.addEventListener('click', safe(function () { goBack(f); }));
        (document.body || document.documentElement).appendChild(f);
      }
      f.setAttribute('data-target', backTarget());
      f.classList.toggle('bb-hidden', m.state === 'hidden');
    }

    function sync() {
      if (syncing) return;
      syncing = true;
      try { measure(); syncFloat(); apply(m.state); } finally { syncing = false; }
    }
    function scheduleSync() {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(safe(sync), 0);
    }

    function flush() {
      timer = 0;
      var p = pending; pending = null;
      if (!p) return;
      apply(m.feed(p.d, p.y, p.now, p.gesture));
    }
    function queue(d, y, gesture) {
      var t = now();
      if (!pending) pending = { d: 0, y: y, now: t, gesture: null };
      pending.d += d; pending.y = y; pending.now = t;
      if (gesture) pending.gesture = gesture;
      if (!timer) timer = setTimeout(safe(flush), 16);   // 不用 rAF：离屏/后台也能稳定触发
    }

    function onScroll(ev) {
      var t = ev.target, y, key;
      if (t === document || t === document.documentElement || t === window || t === document.body) {
        y = window.scrollY || window.pageYOffset || 0; key = window;
      } else if (t && typeof t.scrollTop === 'number') {
        y = t.scrollTop; key = t;
      } else {
        y = window.scrollY || 0; key = window;
      }
      var last = positions.get(key);
      positions.set(key, y);
      if (last == null || Math.abs(y - last) < 0.5) return;
      // 顶部判定始终看主窗口；内部分栏滚动也共用同一状态
      var yAbs = (window.scrollY || window.pageYOffset || 0) || y;
      queue(y - last, yAbs, null);
    }

    function onWheel(e) {
      if (e.deltaY < -2 && m.state === 'hidden') { apply(m.show(now())); }
    }

    var touch = null;
    function onTouchStart(e) {
      if (!e.touches || e.touches.length !== 1) { touch = null; return; }
      touch = { y: e.touches[0].clientY, t: now(), fired: false };
    }
    function onTouchMove(e) {
      if (!touch || touch.fired || !e.touches || e.touches.length !== 1) return;
      var dy = e.touches[0].clientY - touch.y, dt = now() - touch.t;
      // 「向上滑动」= 手指快速上推：隐藏态下立即恢复可见（单向判定，不与普通滚动冲突）
      if (m.state === 'hidden' && dy < -DEFAULTS.flickPx && dt < DEFAULTS.flickMs) {
        touch.fired = true;
        apply(m.show(now()));
      }
    }

    function onRoute() {
      positions = new WeakMap();
      pending = null; clearTimeout(timer); timer = 0;
      m.reset(now());
      scheduleSync();
    }

    document.addEventListener('scroll', safe(onScroll), { capture: true, passive: true });
    window.addEventListener('wheel', safe(onWheel), { passive: true });
    document.addEventListener('touchstart', safe(onTouchStart), { passive: true });
    document.addEventListener('touchmove', safe(onTouchMove), { passive: true });
    window.addEventListener('hashchange', safe(onRoute));
    window.addEventListener('popstate', safe(onRoute));
    window.addEventListener('resize', safe(scheduleSync));
    window.addEventListener('focusin', safe(function (e) {
      if (m.state === 'hidden' && e.target && e.target.closest && e.target.closest('[data-back]')) {
        apply(m.show(now()));   // 键盘聚焦时不把返回键藏起来
      }
    }));

    // SPA 重绘后：新出现的返回键立即继承当前状态，不会出现「新按钮状态错乱」
    var mo = typeof MutationObserver !== 'undefined'
      ? new MutationObserver(safe(function (recs) {
          if (syncing) return;
          // 只关心「元素」的增删（SPA 重绘出的新返回键），忽略播放计时等纯文本更新
          for (var i = 0; i < recs.length; i++) {
            var r = recs[i], n, j;
            for (j = 0; j < (r.addedNodes || []).length; j++) {
              n = r.addedNodes[j]; if (n.nodeType === 1) { scheduleSync(); return; }
            }
            for (j = 0; j < (r.removedNodes || []).length; j++) {
              n = r.removedNodes[j]; if (n.nodeType === 1) { scheduleSync(); return; }
            }
          }
        }))
      : null;
    // 不观察 class 变化，避免与 apply() 自己切的 bb-hidden 形成回环。
    if (mo) mo.observe(document.body, { childList: true, subtree: true });

    sync();
    return { machine: m, sync: sync };
  }

  var api = { Machine: Machine, DEFAULTS: DEFAULTS, start: start };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (root) root.__backButton = api;
  try { if (typeof document !== 'undefined') start(); } catch (e) {
    if (typeof console !== 'undefined' && console.warn) console.warn('[back-button] 初始化失败：', e);
  }
})(typeof window !== 'undefined' ? window : null);
</script>
<!-- END 返回键统一控制 (back-button.js) -->
